[package]
name = "homr-rs"
version = "0.1.0"
edition = "2021"
description = "Experimental Rust port of homr, including its quantized transformer decoder"
license = "AGPL-3.0-only"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "decode_contexts"
path = "bench/decode_contexts.rs"

[[bin]]
name = "check_encoder_ops"
path = "bench/check_encoder_ops.rs"

[[bin]]
name = "check_encoder"
path = "bench/check_encoder.rs"

[[bin]]
name = "encoder_corpus"
path = "bench/encoder_corpus.rs"

[dependencies]
libm = "0.2"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
debug = false

[features]
# Benchmark-only synchronous retired-instruction phase counters (macOS / Node host).
decoder-profile = []
# Follow OpenCV 5.0 where it differs from 4.11 (minAreaRect conventions).
opencv5 = []
