[package]
name = "homr-rs"
version = "0.1.0"
edition = "2021"
description = "Experimental Rust port of homr, including its quantized transformer decoder"
license = "AGPL-3.0-only"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
libm = "0.2"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
debug = false

[features]
# Follow OpenCV 5.0 where it differs from 4.11 (minAreaRect conventions).
opencv5 = []
