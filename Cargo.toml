[package]
name = "homr-rs"
version = "0.1.0"
edition = "2021"
description = "Prototype port of homr's staff detection (homr/staff_detection.py) to Rust"
license = "AGPL-3.0-only"

[dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
debug = false

[features]
# Follow OpenCV 5.0 where it differs from 4.11 (minAreaRect conventions).
opencv5 = []
